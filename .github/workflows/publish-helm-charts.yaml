name: Publish Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'helm-charts/**'
  workflow_dispatch:
    inputs:
      chart_name:
        description: '특정 차트 이름 (비워두면 변경된 모든 차트 배포)'
        required: false
        type: string

concurrency:
  group: publish-helm-charts
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# 차트는 OCI 아티팩트로 oci://ghcr.io/<owner>/charts/<chart> 에 올린다.
# 이미지(ghcr.io/<owner>/<container>)와 경로가 겹치지 않도록 charts/ 아래에 둔다.
env:
  REGISTRY: ghcr.io
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  detect-charts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_charts: ${{ steps.set-matrix.outputs.has_charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed charts
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.chart_name }}" ]; then
              CHART="${{ github.event.inputs.chart_name }}"
              if [ -d "helm-charts/$CHART" ]; then
                echo "matrix=[\"$CHART\"]" >> $GITHUB_OUTPUT
                echo "has_charts=true" >> $GITHUB_OUTPUT
              else
                echo "has_charts=false" >> $GITHUB_OUTPUT
                echo "::error::차트를 찾을 수 없음: $CHART"
              fi
            else
              CHARTS=$(find helm-charts -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
              echo "matrix=$CHARTS" >> $GITHUB_OUTPUT
              echo "has_charts=true" >> $GITHUB_OUTPUT
            fi
          else
            # 디렉토리를 지운 커밋도 변경으로 잡히므로, 지금 남아 있는 차트만 발행한다.
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
                     | grep '^helm-charts/' \
                     | awk -F/ '{print $2}' | sort -u \
                     | while read -r c; do if [ -f "helm-charts/$c/Chart.yaml" ]; then echo "$c"; fi; done)
            if [ -z "$CHANGED" ]; then
              echo "has_charts=false" >> $GITHUB_OUTPUT
            else
              JSON=$(printf '%s\n' $CHANGED | jq -R -s -c 'split("\n")[:-1]')
              echo "matrix=$JSON" >> $GITHUB_OUTPUT
              echo "has_charts=true" >> $GITHUB_OUTPUT
            fi
          fi

  publish:
    needs: detect-charts
    if: needs.detect-charts.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # OCI 태그에는 + 를 쓸 수 없어 helm 이 3.53.0+4.138.0 을 3.53.0_4.138.0 으로 올린다.
      # 설치할 때 --version 3.53.0+4.138.0 으로 지정하면 helm 이 다시 바꿔 찾는다.
      - name: Package and push charts
        env:
          CHARTS: ${{ needs.detect-charts.outputs.matrix }}
        run: |
          mkdir -p .deploy
          for CHART in $(echo "$CHARTS" | jq -r '.[]'); do
            DIR="helm-charts/$CHART"
            NAME=$(helm show chart "$DIR" | awk '/^name:/ {print $2}')
            VERSION=$(helm show chart "$DIR" | awk '/^version:/ {print $2}')
            helm package "$DIR" -d .deploy/
            helm push ".deploy/$NAME-$VERSION.tgz" "$CHART_REPO"
            echo "::notice::Published $CHART_REPO/$NAME:$VERSION"
          done
