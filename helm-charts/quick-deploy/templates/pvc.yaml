{{- define "quick-deploy.persistentVolumeClaim" -}}
{{- $root := .root -}}
{{- $name := .name -}}
{{- $app := .app -}}
{{- $claim := .claim -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .claimName }}
  labels:
    {{- include "quick-deploy.labels" (dict "root" $root "name" $name "app" $app) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with $claim.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ $claim.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ required (printf "apps.%s PVC %s requires size" $name .claimName) $claim.size }}
  {{- $storageClass := "" }}
  {{- if $root.Values.global.storageClass }}
    {{- $storageClass = $root.Values.global.storageClass }}
  {{- else if $root.Values.global.defaultStorageClass }}
    {{- $storageClass = $root.Values.global.defaultStorageClass }}
  {{- else if $claim.storageClassName }}
    {{- $storageClass = $claim.storageClassName }}
  {{- end }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
{{- end }}

{{- range $name, $app := .Values.apps }}
{{- if or (not (hasKey $app "enabled")) $app.enabled }}
{{- if and $app.persistence $app.persistence.enabled }}
{{- $claimName := $app.persistence.name | default (include "quick-deploy.fullname" (dict "root" $ "name" $name "app" $app)) }}
{{- if and $app.persistentVolumeClaims (hasKey $app.persistentVolumeClaims $claimName) }}
{{- $duplicate := index $app.persistentVolumeClaims $claimName }}
{{- if or (not (hasKey $duplicate "enabled")) $duplicate.enabled }}
{{- fail (printf "apps.%s defines duplicate PVC name %s" $name $claimName) }}
{{- end }}
{{- end }}
---
{{ include "quick-deploy.persistentVolumeClaim" (dict "root" $ "name" $name "app" $app "claimName" $claimName "claim" $app.persistence) }}
{{- end }}
{{- range $claimName, $claim := $app.persistentVolumeClaims }}
{{- if or (not (hasKey $claim "enabled")) $claim.enabled }}
---
{{ include "quick-deploy.persistentVolumeClaim" (dict "root" $ "name" $name "app" $app "claimName" $claimName "claim" $claim) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
